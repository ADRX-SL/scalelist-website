name: Publish content to WordPress

# Publishes content/pages/*.md to WordPress on merge to main.
#
# Transport is SSH + WP-CLI, not the REST API: SiteGround's Anti-Bot AI serves an
# sgcaptcha challenge to datacenter IPs, so REST publishing fails from CI runners.
# (Verified twice, from two different GitHub runner IPs.)
#
# Required repository secret:
#   SSH_PRIVATE_KEY   the private half of the key installed in SiteGround Site Tools
#
# Non-secret connection details are set below.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "scripts/**", ".github/workflows/publish-wordpress.yml"]
  pull_request:
    paths: ["content/**", "scripts/**", ".github/workflows/publish-wordpress.yml"]

env:
  SSH_HOST: c1131935.sgvps.net
  SSH_USER: u2-brdthq677x9b
  SSH_PORT: "18765"
  WP_PATH: ~/www/scalelist.com/public_html

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # On a PR: validate the content files only. No credentials, no network, no writes.
      - name: Validate content (dry run, offline)
        if: github.event_name == 'pull_request'
        run: |
          for f in content/pages/*.md; do
            node scripts/md-to-html.mjs "$f" > /dev/null
            grep -q '^title:'  "$f" || { echo "::error file=$f::missing 'title'"; exit 1; }
            grep -q '^slug:'   "$f" || { echo "::error file=$f::missing 'slug'"; exit 1; }
            s=$(sed -n 's/^status:[[:space:]]*//p' "$f" | head -1)
            case "${s:-draft}" in draft|publish) ;; *) echo "::error file=$f::status must be draft|publish"; exit 1;; esac
            echo "ok: $f"
          done

      - name: Install SSH key
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Publish to WordPress
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: /home/runner/.ssh/deploy_key
        run: bash scripts/publish-via-ssh.sh

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
